[project]
name = "spartanbot"
version = "2017.1.0"
description = "CMPE 273 Slack bot that answers questions about the course greensheet"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["env", "nltk_data", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
